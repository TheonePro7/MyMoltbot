services:
  api:
    build: ./api
    restart: unless-stopped
    environment:
      PORT: "8787"
      DATA_DIR: /data
      SQLITE_PATH: /data/anime-os.db
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
    volumes:
      - anime_os_data:/data

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3080}:80"
    environment:
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
    depends_on:
      - api

volumes:
  anime_os_data:
